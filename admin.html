<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Seat Arrangement System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { margin: 0; display: flex; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
        .sidebar { width: 260px; background: white; border-right: 2px solid #e0e0e0; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { margin: 0 0 30px 0; font-size: 18px; color: #333; }
        .sidebar-btn { padding: 12px; margin: 8px 0; background: #f5f5f5; border: none; color: #333; border-radius: 6px; cursor: pointer; text-align: left; font-size: 14px; transition: 0.3s; }
        .sidebar-btn:hover { background: #e0e0e0; }
        .sidebar-btn.logout { background: #dc3545; color: white; margin-top: auto; }
        .sidebar-section-title { margin: 20px 0 10px; font-size: 13px; color: #4b5563; text-transform: uppercase; letter-spacing: 0.04em; }
        .sidebar-tables-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
        .sidebar-table-item { width: 100%; text-align: left; border: 1px solid #e5e7eb; background: #ffffff; color: #1f2937; border-radius: 6px; padding: 8px 10px; font-size: 12px; cursor: pointer; }
        .sidebar-table-item:hover { background: #f3f4f6; }
        .sidebar-table-item.active { border-color: #4a90e2; background: #e8f1ff; color: #1d4ed8; }
        .main-area { flex: 1; overflow-y: auto; background: #f9f9f9; padding: 30px; }
        #adminContent { display: none; width: 100%; }
        #startView { text-align: center; padding: 50px; }
        #generateFormView { display: none; }
        .generate-btn { padding: 20px 40px; font-size: 18px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); transition: 0.3s; }
        .generate-btn:hover { transform: translateY(-2px); }
        #allTablesView { display: none; }
        #editView { display: none; width: 100%; }
        .year-block { border: 2px solid #e0e0e0; border-radius: 10px; padding: 20px; margin: 20px 0; background: white; }
        .year-block h3 { margin-top: 0; color: #667eea; }
    </style>
</head>
<body>
    <div id="adminContent">
        <div class="sidebar">
            <h2>🎓 Admin Panel</h2>
            <button class="sidebar-btn" onclick="showView('tables')">📋 All Tables</button>
            <button class="sidebar-btn" onclick="showView('edit')">👥 Students Data</button>
            <button class="sidebar-btn" onclick="showView('invigilators')">👩‍🏫 Invigilators</button>
            <div class="sidebar-section-title">Generated Tables</div>
            <div id="sidebarTablesList" class="sidebar-tables-list"></div>
            <button class="sidebar-btn logout" onclick="logout()">🚪 Logout</button>
        </div>
        
        <div class="main-area">
            <div id="startView">
                <button class="generate-btn" onclick="showGenerateForm()">➕ Generate New Table</button>
            </div>
            
            <div id="generateFormView">
                <div class="container">
                    <h1 style="margin-bottom: 30px; text-align: center;">🎓 Generate Seating Arrangement</h1>
        
                    <div class="input-section">
                        <div class="form-group">
                            <label>📚 Select Semester:</label>
                            <div class="branch-count-buttons">
                                <button type="button" class="count-btn" onclick="selectSemester('Semester 1')">Semester 1</button>
                                <button type="button" class="count-btn" onclick="selectSemester('Semester 2')">Semester 2</button>
                            </div>
                        </div>
                        
                        <div class="form-group" id="yearSelectionSection" style="display: none;">
                            <label>📅 Select Years (can select multiple):</label>
                            <div class="branch-count-buttons">
                                <button type="button" class="count-btn year-btn" data-year="1st Year" onclick="toggleYear('1st Year')">1st Year</button>
                                <button type="button" class="count-btn year-btn" data-year="2nd Year" onclick="toggleYear('2nd Year')">2nd Year</button>
                                <button type="button" class="count-btn year-btn" data-year="3rd Year" onclick="toggleYear('3rd Year')">3rd Year</button>
                                <button type="button" class="count-btn year-btn" data-year="4th Year" onclick="toggleYear('4th Year')">4th Year</button>
                            </div>
                            <p id="yearRosterHint" style="margin:8px 0 0;color:#6b7280;font-size:13px;"></p>
                        </div>
                        
                        <div id="yearDetailsContainer"></div>
                        
                        <div class="form-group" id="examDetailsSection" style="display: none;">
                            <label>📅 Exam Date:</label>
                            <input type="date" id="examDate" onchange="checkReady()" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;">
                        </div>
                        
                        <div class="form-group" id="examTimeSection" style="display: none;">
                            <label>🕐 Exam Start Time:</label>
                            <input type="time" id="examTime" onchange="checkReady()" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;">
                        </div>

                        <div class="form-group" id="examEndTimeSection" style="display: none;">
                            <label>🕑 Exam End Time:</label>
                            <input type="time" id="examEndTime" onchange="checkReady()" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px;">
                        </div>
                        
                        <div id="roomAssignmentSection" style="display: none; margin-top: 30px;"></div>
                        <div id="roomSelectionDisplay"></div>
                        
                        <div id="generateSection" style="text-align: center; margin-top: 20px; display: none;">
                            <button onclick="generateMultiYearArrangement()" style="background: #4a90e2; padding: 12px 30px; font-size: 16px; color: white; border: none; border-radius: 8px; cursor: pointer;">✨ Generate Arrangement</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="allTablesView">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
                    <h1 style="margin:0;">📋 All Tables</h1>
                    <button class="generate-btn" onclick="showGenerateForm()">➕ Generate Table</button>
                </div>
                <div id="tablesContainer"></div>
            </div>
            <div id="editView"></div>
            <div id="invigilatorView" style="display:none; width:100%;"></div>
        </div>
    </div>

    <div id="roomSelectionModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="background: white; margin: 50px auto; padding: 30px; max-width: 900px; border-radius: 12px; max-height: 80vh; overflow-y: auto;">
            <h3 id="modalTitle" style="margin-top: 0;">Select Rooms</h3>
            <div id="modalRoomList"></div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config-simple.js"></script>
    <script src="rollnumbers.js?v=append-delete-roll-menu-20260926"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="app-multiyear.js?v=all-years-visible-20261002"></script>
    <script src="edit-data.js?v=invigilator-fix-20261002"></script>
    <script src="login.js"></script>
    <script>
        const adminEmail = (sessionStorage.getItem('userEmail') || '').trim().toLowerCase();
        if (!sessionStorage.getItem('isLoggedIn') ||
            sessionStorage.getItem('userRole') !== 'admin' ||
            !window.ADMIN_EMAILS.includes(adminEmail)) {
            sessionStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('userEmail');
            sessionStorage.removeItem('userRole');
            window.location.href = 'index.html';
        } else {
            document.getElementById('adminContent').style.display = 'flex';
            window.studentDatabaseReady = loadStudentDatabaseOverrides()
                .catch(error => console.error('Could not load saved student records:', error))
                .finally(() => loadTablesSidebar());
        }
        
        async function showGenerateForm() {
            await window.studentDatabaseReady;
            await loadStudentDatabaseOverrides();
            updateYearAvailabilityButtons();
            document.getElementById('startView').style.display = 'none';
            document.getElementById('generateFormView').style.display = 'block';
            document.getElementById('allTablesView').style.display = 'none';
            document.getElementById('editView').style.display = 'none';
        }
        
        function showView(view, selectedTableId = null) {
            if (view === 'tables') {
                document.getElementById('startView').style.display = 'none';
                document.getElementById('generateFormView').style.display = 'none';
                document.getElementById('editView').style.display = 'none';
                document.getElementById('invigilatorView').style.display = 'none';
                document.getElementById('allTablesView').style.display = 'block';
                loadAllTables(selectedTableId);
            } else if (view === 'edit') {
                document.getElementById('startView').style.display = 'none';
                document.getElementById('generateFormView').style.display = 'none';
                document.getElementById('allTablesView').style.display = 'none';
                document.getElementById('invigilatorView').style.display = 'none';
                document.getElementById('editView').style.display = 'block';
                initEditView();
            } else if (view === 'invigilators') {
                document.getElementById('startView').style.display = 'none';
                document.getElementById('generateFormView').style.display = 'none';
                document.getElementById('allTablesView').style.display = 'none';
                document.getElementById('editView').style.display = 'none';
                document.getElementById('invigilatorView').style.display = 'block';
                initInvigilatorView();
            }
        }
        
        function logout() {
            if (window.isSavingData) {
                alert('⏳ Data is currently being saved. Please wait...');
                return;
            }
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
