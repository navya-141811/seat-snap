<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Snap - Exam Seat Arrangement System</title>
    <link rel="stylesheet" href="home.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="home-container">
        <div class="home-box">
            <div class="home-header">
                <h1 style="font-size: 2.5em; margin-bottom: 5px;">🎓 Seat Snap</h1>
                <p style="color: #6c757d; font-size: 14px; margin: 0;">Exam Seat Arrangement System</p>
            </div>

            
            <div style="margin: 30px 0; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 10px; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);">
                <h3 style="margin: 0 0 15px 0; color: white; font-size: 18px;">👨‍🎓 Student Portal</h3>
                <input type="text" id="studentRollNo" placeholder="Enter your roll number (e.g., 25wh1a0501)" 
                       style="width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <button onclick="searchStudent()" style="width: 100%; padding: 12px; background: white; color: #667eea; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                    🔍 Find My Seat
                </button>
            </div>
            
            <div style="text-align: center; margin: 20px 0; color: #6c757d; font-size: 13px;">OR</div>
            
            <div style="margin: 20px 0;">
                <p style="text-align: center; color: #6c757d; margin-bottom: 12px; font-size: 13px;">Admin Sign-In</p>
                <button type="button" onclick="devAccess()" style="display: block; margin: 0 auto 12px; padding: 11px 16px; width: 320px; max-width: 100%; background: #6c757d; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;">🛠️ Dev Access</button>
                <div id="g_id_onload"
                     data-client_id="361381758196-dkfkah9p0rdri0hrp1gbgdtnqqrkmul5.apps.googleusercontent.com"
                     data-callback="handleGoogleLogin"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="sign_in_with"
                     data-shape="rectangular"
                     data-logo_alignment="left"
                     data-width="320"
                     style="display: flex; justify-content: center;">
                </div>
            </div>
            
            <div id="errorMsg" style="display: none; margin-top: 15px; padding: 10px; background: #fff5f5; color: #e53e3e; border-radius: 8px; text-align: center;"></div>
        </div>
    </div>
    
    <script src="login.js"></script>
    <script>
        function devAccess() {
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('userEmail', 'navyachinta31545@gmail.com');
            sessionStorage.setItem('userName', 'Dev');
            sessionStorage.setItem('userRole', 'admin');
            window.location.href = 'admin.html';
        }

        function startAdminSignIn() {
            if (window.google?.accounts?.id) {
                window.google.accounts.id.prompt();
                return;
            }
            document.querySelector('.g_id_signin')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function searchStudent() {
            const rollNo = document.getElementById('studentRollNo').value.trim().toLowerCase();
            if (!rollNo) {
                alert('⚠️ Please enter your roll number');
                return;
            }
            window.location.href = `student.html?roll=${rollNo}`;
        }
        
        document.getElementById('studentRollNo')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchStudent();
            }
        });
    </script>
    

</body>
</html>
