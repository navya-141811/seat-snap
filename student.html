<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Snap - Your Seat Details</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>
    <div class="student-container">
        <div class="student-box">
            <button class="back-btn" onclick="goBack()">🔙 Back</button>
            
            <div class="student-header">
                <h1>🪑</h1>
                <h2>Your Seating Details</h2>
            </div>
            
            <div id="loadingSection" style="text-align: center; padding: 40px;">
                <p style="font-size: 18px; color: #6b7280;">🔍 Searching for your seat...</p>
            </div>
            
            <div id="resultSection" class="result-section" style="display: none;">
                <div style="text-align: center; margin-bottom: 20px;">
                    <h3 style="color: #1e40af; font-size: 24px; margin: 0;">Roll Number: <span id="rollNumber"></span></h3>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr; gap: 20px;">
                    <div class="result-card">
                        <h3>📋 Exam Details</h3>
                        <div class="result-info">
                            <div class="info-row">
                                <span class="label">Subject:</span>
                                <span class="value" id="subject"></span>
                            </div>
                            <div class="info-row" style="gap: 6px;">
                                <span class="label">Date:</span>
                                <span class="value" id="examDate"></span>
                                <span class="label" style="margin-left:16px;">Time:</span>
                                <span class="value" id="examTime"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="result-card" style="margin-top: 20px;">
                    <h3>🗺️ <span id="layoutClassroom"></span></h3>
                    <div id="classroomLayout" class="classroom-grid"></div>
                </div>
            </div>
            
            <div id="notFoundSection" style="display: none; text-align: center; padding: 40px;">
                <h3 style="color: #dc2626; font-size: 20px;">❌ Seat Not Found</h3>
                <p style="color: #6b7280; margin-top: 10px;">No seating arrangement found for this roll number.</p>
                <p style="color: #6b7280;">Please check your roll number or contact admin.</p>
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config-simple.js"></script>
    <script src="student.js"></script>
</body>
</html>
